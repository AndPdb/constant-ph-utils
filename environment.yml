# constant-ph-utils conda environment
#   conda env create -f environment.yml
#   conda activate constant-ph-utils
name: constant-ph-utils
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.20
  - pandas>=1.3
  - matplotlib-base>=3.4     # -base: no Qt/GUI toolkit, enough for Agg + savefig
  # Optional: shell tab-completion for run_analysis.py flags
  # - argcomplete>=2.0